<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dagger & Die - Live Leaderboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0a0c18;
    min-height: 100vh;
    color: #fff;
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ── RPG background layers ── */
  .idx-bg-base { position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 120% 80% at 50% 110%, #1a1040 0%, transparent 60%),
      radial-gradient(ellipse 80% 60% at 20% 80%, #0d1a3a 0%, transparent 50%),
      radial-gradient(ellipse 80% 60% at 80% 80%, #1a0d2e 0%, transparent 50%),
      radial-gradient(ellipse 100% 50% at 50% 0%, #0f1628 0%, transparent 60%),
      linear-gradient(180deg, #080b16 0%, #0e1225 40%, #141833 70%, #1a1040 100%);
  }
  .idx-bg-texture { position: fixed; inset: 0; z-index: 1; opacity: 0.04;
    background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='60' height='60' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
    background-size: 200px 200px;
  }
  .idx-bg-vignette { position: fixed; inset: 0; z-index: 2;
    background: radial-gradient(ellipse 70% 60% at 50% 50%, transparent 30%, rgba(5,5,15,0.7) 100%);
    pointer-events: none;
  }
  .idx-bg-grid { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0.02;
    background-image: linear-gradient(rgba(150,160,200,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(150,160,200,0.3) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .idx-bg-fog { position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden; }
  .idx-bg-fog-layer { position: absolute; width: 200%; height: 100%; top: 0; left: -50%;
    background: radial-gradient(ellipse 300px 80px at 20% 70%, rgba(100,120,180,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 400px 100px at 60% 80%, rgba(80,60,140,0.05) 0%, transparent 70%),
      radial-gradient(ellipse 250px 60px at 80% 60%, rgba(60,80,160,0.04) 0%, transparent 70%);
    animation: idxFogDrift 40s ease-in-out infinite alternate;
  }
  .idx-bg-fog-layer:nth-child(2) {
    background: radial-gradient(ellipse 350px 90px at 30% 85%, rgba(70,50,120,0.05) 0%, transparent 70%),
      radial-gradient(ellipse 280px 70px at 70% 75%, rgba(90,100,170,0.04) 0%, transparent 70%);
    animation: idxFogDrift2 55s ease-in-out infinite alternate; opacity: 0.8;
  }
  @keyframes idxFogDrift { 0% { transform: translateX(0) translateY(0); } 100% { transform: translateX(5%) translateY(-2%); } }
  @keyframes idxFogDrift2 { 0% { transform: translateX(0) translateY(0); } 100% { transform: translateX(-4%) translateY(1%); } }
  .idx-bg-particles { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
  .idx-bg-particle { position: absolute; border-radius: 50%; opacity: 0; animation: idxFloatUp linear infinite; }
  @keyframes idxFloatUp { 0% { opacity: 0; transform: translateY(0) translateX(0) scale(1); } 10% { opacity: 1; } 90% { opacity: 0.6; } 100% { opacity: 0; transform: translateY(-100vh) translateX(40px) scale(0.3); } }
  .idx-bg-runes { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .idx-bg-rune { position: absolute; font-family: serif; opacity: 0; animation: idxRuneFloat 12s ease-in-out infinite; filter: blur(0.5px); text-shadow: 0 0 8px currentColor, 0 0 20px currentColor; }
  @keyframes idxRuneFloat { 0% { opacity: 0; transform: translateY(20px) rotate(0deg) scale(0.8); } 15% { opacity: 0.15; } 50% { opacity: 0.25; transform: translateY(-10px) rotate(5deg) scale(1); } 85% { opacity: 0.12; } 100% { opacity: 0; transform: translateY(-30px) rotate(-3deg) scale(0.9); } }
  .idx-bg-corner { position: fixed; z-index: 6; width: 120px; height: 120px; pointer-events: none; opacity: 0.12; }
  .idx-bg-corner svg { width: 100%; height: 100%; }
  .idx-bg-corner-tl { top: 12px; left: 12px; }
  .idx-bg-corner-tr { top: 12px; right: 12px; transform: scaleX(-1); }
  .idx-bg-corner-bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
  .idx-bg-corner-br { bottom: 12px; right: 12px; transform: scale(-1, -1); }
  .idx-bg-ambient { position: fixed; z-index: 3; pointer-events: none; width: 500px; height: 500px; border-radius: 50%;
    background: radial-gradient(circle, rgba(180,140,60,0.03) 0%, transparent 70%); top: 50%; left: 50%;
    transform: translate(-50%, -50%); animation: idxAmbientPulse 8s ease-in-out infinite;
  }
  @keyframes idxAmbientPulse { 0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } }
  .idx-bg-torch { position: fixed; z-index: 3; pointer-events: none; width: 300px; height: 400px; border-radius: 50%; animation: idxTorchFlicker 3s ease-in-out infinite alternate; }
  .idx-bg-torch-left { left: -100px; top: 30%; background: radial-gradient(ellipse, rgba(200,120,40,0.04) 0%, transparent 70%); animation-duration: 2.8s; }
  .idx-bg-torch-right { right: -100px; top: 25%; background: radial-gradient(ellipse, rgba(200,120,40,0.035) 0%, transparent 70%); animation-duration: 3.2s; animation-delay: 0.5s; }
  @keyframes idxTorchFlicker { 0% { opacity: 0.6; transform: scale(1); } 25% { opacity: 1; transform: scale(1.05); } 50% { opacity: 0.7; transform: scale(0.98); } 75% { opacity: 0.9; transform: scale(1.02); } 100% { opacity: 0.65; transform: scale(1); } }
  #idxParticleCanvas { position: fixed; inset: 0; z-index: 4; pointer-events: none; }

  .main-content { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; }
  .container { max-width: 700px; margin: 0 auto; padding: 32px 20px; width: 100%; flex: 1; }

  header { text-align: center; margin-bottom: 28px; }
  h1 {
    font-family: 'Cinzel Decorative', 'Times New Roman', serif;
    font-size: 2.2rem; font-weight: 700; color: #d4a84b;
    text-shadow: 2px 2px 0 #5c3d1e, 4px 4px 0 rgba(0,0,0,0.3), 0 0 20px rgba(212, 168, 75, 0.3);
    letter-spacing: 3px; margin-bottom: 4px;
  }
  .subtitle {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1rem; color: #feca57; letter-spacing: 2px;
  }

  .status-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-bottom: 20px; font-size: 0.8rem; color: rgba(255,255,255,0.5);
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #555;
    transition: background 0.3s;
  }
  .status-dot.connected { background: #2ecc71; box-shadow: 0 0 6px rgba(46,204,113,0.6); }

  .panel {
    background: rgba(255,255,255,0.08); border-radius: 20px; padding: 24px;
    margin-bottom: 24px; border: 1px solid rgba(255,255,255,0.15);
  }
  .panel-title {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 1.1rem; color: #feca57; font-weight: 600;
    margin-bottom: 16px; text-align: center;
  }

  .targets-row {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;
  }
  .die-badge {
    width: 44px; height: 44px;
    background: linear-gradient(145deg, #2d3436, #1e272e);
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; font-weight: bold;
    border: 2px solid rgba(255,255,255,0.2);
    box-shadow: 3px 3px 10px rgba(0,0,0,0.3);
  }
  .die-badge.odd { color: #ff6b6b; border-color: #ff6b6b; }
  .die-badge.even { color: #48dbfb; border-color: #48dbfb; }

  .leaderboard { width: 100%; border-collapse: separate; border-spacing: 0; }
  .leaderboard th, .leaderboard td {
    padding: 12px 16px; text-align: left;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .leaderboard th {
    font-family: 'Cinzel', Georgia, serif;
    color: #feca57; font-size: 0.85rem; font-weight: 600;
    border-bottom: 2px solid rgba(254, 202, 87, 0.3);
  }
  .leaderboard td { color: rgba(255,255,255,0.9); }
  .leaderboard .rank-1 td { color: #feca57; font-weight: bold; }
  .leaderboard .rank-2 td { color: #c0c0c0; }
  .leaderboard .rank-3 td { color: #cd7f32; }
  .leaderboard .rank-cell { font-size: 1.3rem; font-weight: bold; width: 50px; text-align: center; }
  .leaderboard .score-cell { font-weight: bold; font-size: 1.1rem; text-align: right; }
  .leaderboard .hits-cell { text-align: center; font-size: 0.9rem; color: rgba(255,255,255,0.6); }
  .leaderboard .name-cell { font-size: 1rem; }
  .leaderboard .status-cell { text-align: center; font-size: 0.8rem; }
  .leaderboard .status-badge {
    display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem;
    font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase;
  }
  .leaderboard .badge-registered {
    background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.15);
  }
  .leaderboard .badge-throwing {
    background: rgba(254,202,87,0.15); color: #feca57; border: 1px solid rgba(254,202,87,0.3);
  }
  .leaderboard .badge-locked {
    background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3);
  }
  .leaderboard .badge-scored {
    background: rgba(46,204,113,0.15); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3);
  }
  .leaderboard .badge-tiebreaker {
    background: rgba(254,202,87,0.2); color: #feca57; border: 1px solid rgba(254,202,87,0.45);
  }

  .tb-live-banner {
    display: none; text-align: center; padding: 12px; margin-bottom: 20px;
    border-radius: 12px;
    background: linear-gradient(45deg, rgba(254,202,87,0.15), rgba(212,168,75,0.15));
    border: 1px solid rgba(254,202,87,0.3);
    font-family: 'Cinzel', Georgia, serif; font-size: 1rem; color: #feca57;
    letter-spacing: 1px;
  }
  .tb-live-banner.visible { display: block; }

  .no-data {
    text-align: center; padding: 40px 20px;
    color: rgba(255,255,255,0.4); font-style: italic;
    font-family: 'Cinzel', Georgia, serif;
  }

  .finalized-banner {
    display: none; text-align: center; padding: 12px; margin-bottom: 20px;
    border-radius: 12px;
    background: linear-gradient(45deg, rgba(254,202,87,0.15), rgba(212,168,75,0.15));
    border: 1px solid rgba(254,202,87,0.3);
    font-family: 'Cinzel', Georgia, serif; font-size: 1rem; color: #feca57;
    letter-spacing: 1px;
  }
  .finalized-banner.visible { display: block; }

  footer {
    text-align: center; padding: 20px; color: rgba(255,255,255,0.3); font-size: 0.75rem;
    border-top: 1px solid rgba(255,255,255,0.06);
  }

  @media (max-width: 500px) {
    h1 { font-size: 1.6rem; }
    .subtitle { font-size: 0.85rem; }
    .leaderboard th, .leaderboard td { padding: 8px 10px; }
    .die-badge { width: 36px; height: 36px; font-size: 1rem; }
    .stat-chip { min-width: 75px; padding: 8px 10px; }
    .stat-chip .value { font-size: 1rem; }
  }
</style>
</head>
<body>

    </svg>
  </div>
  <div class="idx-bg-corner idx-bg-corner-br">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 5 L5 40 Q5 45 10 45 L20 45" stroke="#b48c3c" stroke-width="1.5" opacity="0.8"/>
      <path d="M5 5 L40 5 Q45 5 45 10 L45 20" stroke="#b48c3c" stroke-width="1.5" opacity="0.8"/>
      <circle cx="5" cy="5" r="3" fill="#b48c3c" opacity="0.6"/>

      <circle cx="20" cy="20" r="1.5" fill="#b48c3c" opacity="0.3"/>
      <path d="M30 8 L33 5 L36 8 L33 11 Z" stroke="#b48c3c" stroke-width="0.6" fill="none" opacity="0.4"/>
      <path d="M8 30 L5 33 L8 36 L11 33 Z" stroke="#b48c3c" stroke-width="0.6" fill="none" opacity="0.4"/>
    </svg>
  </div>

  <div class="main-content">
    <div class="container">
      <header>
        <h1>Dagger & Die</h1>
        <div class="subtitle">Live Leaderboard</div>
      </header>

      <div class="status-bar">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Waiting for game data&hellip;</span>
      </div>

      <div class="finalized-banner" id="finalized-banner">Game Finalized</div>
      <div class="tb-live-banner" id="tb-live-banner">Tiebreaker in Progress</div>

      <div class="panel" id="targets-panel" style="display:none;">
        <div class="panel-title">Targets</div>
        <div class="targets-row" id="targets-row"></div>
      </div>

      <div class="panel">
        <div class="panel-title">Standings</div>
        <div class="no-data" id="no-data">No players yet&hellip;</div>
        <table class="leaderboard" id="leaderboard" style="display:none;">
          <thead>
            <tr>
              <th style="text-align:center;">#</th>
              <th>Player</th>
              <th style="text-align:center;">Hits</th>
              <th style="text-align:center;">Status</th>
              <th style="text-align:right;">Score</th>
            </tr>
          </thead>
          <tbody id="lb-body"></tbody>
        </table>
      </div>
    </div>

    <footer>Dagger &amp; Die &mdash; Competition Mode</footer>
  </div>

  <script src="rpg-bg-particles.js"
    data-particle-container="idxCssParticles" data-particle-class="idx-bg-particle"
    data-rune-container="idxRuneContainer" data-rune-class="idx-bg-rune"></script>
  <script src="rpg-bg-canvas.js"></script>
  <script>
    const channel = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('daggerdie-leaderboard') : null;
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const targetsPanel = document.getElementById('targets-panel');
    const targetsRow = document.getElementById('targets-row');
    const noData = document.getElementById('no-data');
    const leaderboard = document.getElementById('leaderboard');
    const lbBody = document.getElementById('lb-body');
    const finalizedBanner = document.getElementById('finalized-banner');
    const tbLiveBanner = document.getElementById('tb-live-banner');

    const RANK_MEDALS = { 1: '\u{1F947}', 2: '\u{1F948}', 3: '\u{1F949}' };
    function escHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    function renderTargets(targets) {
      if (!targets || !targets.length) { targetsPanel.style.display = 'none'; return; }
      targetsPanel.style.display = '';
      targetsRow.innerHTML = targets.map(t =>
        '<div class="die-badge ' + (t % 2 === 0 ? 'even' : 'odd') + '">' + t + '</div>'
      ).join('');
    }

    function renderLeaderboard(data) {
      const players = data.players || [];
      if (!players.length) {
        noData.style.display = '';
        leaderboard.style.display = 'none';
        return;
      }
      noData.style.display = 'none';
      leaderboard.style.display = '';

      // Players arrive pre-sorted from the game when possible; re-sort by score + TB history
      const sorted = players.map((p, i) => ({ ...p, idx: i }))
        .sort((a, b) => {
          if (b.total !== a.total) return b.total - a.total;
          const ah = a.tbHistory || [];
          const bh = b.tbHistory || [];
          const len = Math.max(ah.length, bh.length);
          for (let r = 0; r < len; r++) {
            const av = ah[r];
            const bv = bh[r];
            if (av == null && bv == null) continue;
            if (av == null) return 1;
            if (bv == null) return -1;
            if (bv !== av) return bv - av;
          }
          return a.name.localeCompare(b.name);
        });

      let rank = 0;
      let prevKey = '';
      let html = '';
      const inTb = data.phase === 'tiebreaker';
      sorted.forEach((p, i) => {
        const key = String(p.total) + '|' + (p.tbHistory || []).join(',');
        if (key !== prevKey) { rank = i + 1; prevKey = key; }
        // After ties are broken (finalized), use unique places
        const displayRank = data.finalized ? (i + 1) : rank;
        const earnedPodium = p.total > 0 && displayRank <= 3;
        const rankClass = earnedPodium ? ' rank-' + displayRank : '';
        const display = earnedPodium ? RANK_MEDALS[displayRank] : (data.finalized ? displayRank : (i + 1));
        const STATUS_LABELS = {
          registered: 'Registered',
          throwing: 'Throwing',
          scored: 'Scored',
          locked: 'Locked',
          tiebreaker: 'Tiebreaker'
        };
        const st = p.status || 'registered';
        const statusBadge = '<span class="status-badge badge-' + st + '">' + (STATUS_LABELS[st] || st) + '</span>';
        const scoreLabel = (inTb && p.tbTotal != null)
          ? (p.total + ' <span style="color:rgba(255,255,255,0.45);font-weight:normal;font-size:0.8rem;">(TB ' + p.tbTotal + ')</span>')
          : String(p.total);
        const hitsLabel = inTb && st === 'tiebreaker'
          ? (p.hits + '/9 TB')
          : (p.hits + '/9');

        html += '<tr class="' + rankClass + '">';
        html += '<td class="rank-cell">' + display + '</td>';
        html += '<td class="name-cell">' + escHtml(p.name) + '</td>';
        html += '<td class="hits-cell">' + hitsLabel + '</td>';
        html += '<td class="status-cell">' + statusBadge + '</td>';
        html += '<td class="score-cell">' + scoreLabel + '</td>';
        html += '</tr>';
      });
      lbBody.innerHTML = html;
    }

    if (channel) {
      channel.onmessage = function(event) {
        const msg = event.data;
        statusDot.classList.add('connected');
        statusText.textContent = 'Connected — live updates';

        if (msg.type === 'leaderboard') {
          renderTargets(msg.targets);
          renderLeaderboard(msg);

          if (msg.finalized) {
            finalizedBanner.classList.add('visible');
            tbLiveBanner.classList.remove('visible');
            statusText.textContent = 'Game finalized';
          } else if (msg.phase === 'tiebreaker') {
            finalizedBanner.classList.remove('visible');
            tbLiveBanner.textContent = 'Tiebreaker Round ' + (msg.tbRound || 1) + ' — same targets';
            tbLiveBanner.classList.add('visible');
            statusText.textContent = 'Tiebreaker in progress';
          } else {
            finalizedBanner.classList.remove('visible');
            tbLiveBanner.classList.remove('visible');
          }
        }
      };
    } else {
      statusText.textContent = 'BroadcastChannel not supported in this browser.';
    }
  </script>
</body>
</html>
